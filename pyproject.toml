[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "deepsearch-paper-agent"
version = "0.1.0"
description = "A local evidence-grounded research assistant for PDF papers."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26,<3",
    "pypdf>=6.19,<7",
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.30,<1",
    "python-dotenv>=1,<2",
    "pypdfium2>=4.30,<6",
    "Pillow>=10,<13",
    "jieba>=0.42.1,<0.43",
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest", "reportlab"]
mcp = ["mcp>=2.3,<3", "jsonschema>=4.20,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
